<!DOCTYPE html>
<html>
<head>
<title>Departments - SBGI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI',Arial,sans-serif; }
body { background:#0a0b14; color:#e8e9f3; min-height:100vh; }
.glow { position:fixed; border-radius:50%; filter:blur(120px); opacity:0.25; z-index:0; }
.glow-1 { width:500px; height:500px; background:#6366f1; top:-150px; left:-100px; }
.layout { display:flex; position:relative; z-index:1; }
.sidebar { width:240px; height:100vh; position:fixed; padding:26px 18px; background:rgba(255,255,255,0.03); border-right:1px solid rgba(255,255,255,0.06); backdrop-filter:blur(20px); }
.brand { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
.brand-icon { width:40px; height:40px; border-radius:10px; background:linear-gradient(135deg,#6366f1,#8b5cf6); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
.brand-name { font-size:15px; font-weight:700; }
.brand-sub { font-size:10.5px; color:#7a7d99; margin:10px 0 28px 0; line-height:1.5; }
.nav-item { display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:10px; margin-bottom:4px; font-size:13.5px; color:#9497b5; text-decoration:none; transition:all .2s; }
.nav-item:hover { background:rgba(255,255,255,0.04); color:#e8e9f3; }
.nav-item.active { background:linear-gradient(135deg,rgba(99,102,241,0.2),rgba(139,92,246,0.1)); color:#fff; font-weight:600; box-shadow:inset 0 0 0 1px rgba(99,102,241,0.3); }
.accred-badge { margin-top:28px; padding:12px; text-align:center; background:rgba(212,175,55,0.1); border:1px solid rgba(212,175,55,0.3); border-radius:10px; font-size:10.5px; color:#d4af37; }
.main { margin-left:240px; padding:28px 34px; width:100%; }
h1 { font-size:24px; font-weight:700; margin-bottom:22px; }
.dept-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
.dept-card { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:22px; text-decoration:none; color:#e8e9f3; display:block; transition:transform .2s; }
.dept-card:hover { transform:translateY(-3px); border-color:rgba(99,102,241,0.4); }
.dept-card h3 { font-size:15px; margin-bottom:12px; }
.dept-stats { display:flex; gap:20px; }
.dept-stats div { font-size:22px; font-weight:700; color:#a5b4fc; }
.dept-stats span { display:block; font-size:11px; color:#7a7d99; font-weight:400; }
</style>
</head>
<body>
<div class="glow glow-1"></div>
<div class="layout">
    <div class="sidebar">
        <div class="brand"><div class="brand-icon">S</div><div class="brand-name">SBGI, Miraj</div></div>
        <div class="brand-sub">Sanjay Bhokare Group of Institutes<br>Affiliated to DBATU, Lonere</div>
        <a href="/" class="nav-item">📋 Dashboard</a>
        <a href="/departments" class="nav-item active">🏛️ Departments</a>
        <a href="/students" class="nav-item">👥 Students</a>
        <a href="/leaderboard" class="nav-item">🏆 Leaderboard</a>
        <div class="accred-badge">NAAC 'A' Grade<br>AICTE Approved</div>
    </div>
    <div class="main">
        <h1>Departments</h1>
        <div class="dept-grid">
            {% for d in dept_list %}
            <a href="/?department={{ d.name }}" class="dept-card">
                <h3>{{ d.name }}</h3>
                <div class="dept-stats">
                    <div>{{ d.records }}<span>Records</span></div>
                    <div>{{ d.students }}<span>Students</span></div>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</div>
</body>
</html>
