<!DOCTYPE html>
<html>
<head>
<title>{{ name }} - SBGI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI',Arial,sans-serif; }
body { background:#f5f6fa; color:#1c1d29; min-height:100vh; }
.main { padding:34px; max-width:800px; margin:0 auto; }
.back { color:#4338ca; text-decoration:none; font-size:13px; }
h1 { font-size:26px; margin:14px 0 20px 0; text-transform:capitalize; }
.panel { background:#ffffff; border:1px solid rgba(0,0,0,0.06); border-radius:16px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.04); }
table { width:100%; border-collapse:collapse; }
th, td { padding:12px 14px; text-align:left; font-size:13px; }
th { color:#6b6e80; text-transform:uppercase; font-size:10px; letter-spacing:.6px; border-bottom:1px solid rgba(0,0,0,0.06); }
td { border-bottom:1px solid rgba(0,0,0,0.04); }
</style>
</head>
<body>
<div class="main">
    <a href="/students" class="back">← Back to Students</a>
    <h1>{{ name }}</h1>
    <div class="panel">
        <table>
            <tr><th>Date</th><th>Time</th><th>Department</th><th>Section</th></tr>
            {% for r in records %}
            <tr><td>{{ r[2] }}</td><td>{{ r[3] }}</td><td>{{ r[4] }}</td><td>{{ r[5] }}</td></tr>
            {% endfor %}
        </table>
    </div>
</div>
</body>
</html>
