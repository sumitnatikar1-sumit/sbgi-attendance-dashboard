<!DOCTYPE html>
<html>
<head>
<title>Admin Login - SBGI</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Inter','Segoe UI',Arial,sans-serif; }
body { background:#f5f6fa; min-height:100vh; display:flex; align-items:center; justify-content:center; }
.login-box { background:#ffffff; border:1px solid rgba(0,0,0,0.06); border-radius:16px; padding:34px; width:320px; box-shadow:0 4px 16px rgba(0,0,0,0.06); }
.login-box h2 { font-size:19px; color:#1c1d29; margin-bottom:4px; }
.login-box p { font-size:12.5px; color:#6b6e80; margin-bottom:20px; }
.login-box input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid rgba(0,0,0,0.1); margin-bottom:12px; font-size:13px; }
.login-box button { width:100%; padding:10px; border-radius:8px; border:none; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:white; font-weight:600; font-size:13px; cursor:pointer; }
.error { color:#dc2626; font-size:12px; margin-bottom:10px; }
.back { display:block; text-align:center; margin-top:14px; font-size:12px; color:#6b6e80; text-decoration:none; }
</style>
</head>
<body>
<div class="login-box">
    <h2>Admin Login</h2>
    <p>SBGI Attendance Dashboard</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
    <a href="/" class="back">← Back to Dashboard</a>
</div>
</body>
</html>
